# Publishes the evidence page (web/) to GitHub Pages. The page reads CC3 and Sepolia over public
# RPCs whose CORS allows any origin, so the live gap instrument and attack table work once hosted.
# Enable once: repo Settings -> Pages -> Source: "GitHub Actions". Then every push to web/ redeploys.
name: Deploy evidence page

on:
  push:
    branches: [master]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
