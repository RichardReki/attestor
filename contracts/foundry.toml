[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.25"
# CC3 is a Substrate-based EVM whose block headers carry no `prevrandao`, so forking it under a
# post-Paris EVM version fails header validation before any test runs. London also keeps PUSH0 out
# of the bytecode, which is the safer assumption for a non-mainline EVM we have to deploy to.
evm_version = "london"
optimizer = true
optimizer_runs = 200
# The 7-field ABI decode in AttestedTx exceeds the legacy pipeline's stack limit. via-IR is the
# documented remedy and the codebase is small enough that the extra compile time is free.
via_ir = true
# The decoder test reads a captured real-world proof rather than a hand-written one.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
cc3 = "https://rpc.cc3-testnet.creditcoin.network"
